<!DOCTYPE html>
<html>

<head>
    <title>Page 5</title>
</head>

<body style ="background-color: #073B3A; color: #F1FAEE;">

    <h1>Totally Legit Registration</h1>
    <hr>


    <p>
        <mark>Fill this out. We promise nothing suspicious will happen.</mark>
    </p>

    <form>

        <!-- Name -->
        <label for="name">
            🧑 Who are you, legend?
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required>

        <br><br>


        <!-- Title -->
        <label>👑 Choose your character:</label>

        <input type="radio" name="title" id="mr">
        <label for="mr">Mr.</label>

        <input type="radio" name="title" id="ms">
        <label for="ms">Ms.</label>

        <br><br>


        <!-- Email -->
        <label for="email">
            📧 Where can we <s>spam</s> contact you?
        </label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required>

        <br><br>


        <!-- Password -->
        <label for="password">
            🔐 Create a Secret Password:
        </label>

        <input
            type="password"
            id="password"
            placeholder="Not 123456 again 💀"
            required>

        <br><br>


        <!-- Phone -->
        <label for="phone">
            📞 Your hotline:
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="+91 XXXXX XXXXX">

        <br><br>


        <!-- Date -->
        <label for="dob">
            🎂 When did the lore begin?
        </label>

        <input type="date" id="dob">

        <br><br>


        <!-- Gender -->
        <label>🧬 Player settings:</label>

        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>

        <input type="radio" name="gender" id="other">
        <label for="other">Other</label>

        <br><br>


        <!-- Checkbox -->
        <input type="checkbox" id="terms" required>

        <label for="terms">
            I promise I actually read this 👀
        </label>

        <br><br>


        <!-- Buttons -->
        <button type="reset">
            🔄 I Regret Everything
        </button>

        <button type="submit">
            🚀 LET'S GOOOO
        </button>

    </form>
